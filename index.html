  <script>
    (function () {
      fetch("build.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.json(); })
        .then(function (info) {
          var now = String((info && info.build) || "");
          if (!now) return;
          var seen = "";
          try { seen = localStorage.getItem("ownex-build") || ""; } catch (err) {}
          try { localStorage.setItem("ownex-build", now); } catch (err) {}
          if (seen && seen !== now) {
            location.reload();
          }
        })
        .catch(function () {});
    })();
  </script>

  <script>
    (function () {
      var el = document.getElementById("glance-visitor-num");
      function paintCount(n) {
        var num = Number(n);
        if (!isFinite(num) || num < 1) return;
        if (el) el.textContent = String(num);
        try { localStorage.setItem("ownex-guest-total", String(num)); } catch (err) {}
      }
      var counted = false;
      try { counted = sessionStorage.getItem("ownex-open-hit") === "1"; } catch (err) {}
      var n = 0;
      try { n = Number(localStorage.getItem("ownex-guest-total") || 0) || 0; } catch (err) {}
      if (!counted) {
        n += 1;
        try { sessionStorage.setItem("ownex-open-hit", "1"); } catch (err) {}
      }
      paintCount(n);
      window.ownexAbacus = function (payload) {
        var v = Number((payload && (payload.value || payload.total || payload.count)) || 0);
        if (v > n) paintCount(v);
      };
      var kind = counted ? "get" : "hit";
      var src = "https://abacus.jsn.cam/" + kind + "/ownex-yinxiakr/opens?callback=ownexAbacus&t=" + Date.now();
      var tag = document.createElement("script");
      tag.src = src;
      tag.onerror = function () {
        var tag2 = document.createElement("script");
        tag2.src = "https://abacus.jasoncameron.dev/" + kind + "/ownex-yinxiakr/opens?callback=ownexAbacus&t=" + Date.now();
        document.head.appendChild(tag2);
      };
      document.head.appendChild(tag);

      var busy = 0;
      var staying = false;
      var keepTimers = [];
      function hash(pin, salt) {
        var h = 2166136261;
        var s = String(salt) + String(pin);
        for (var i = 0; i < s.length; i += 1) {
          h ^= s.charCodeAt(i);
          h = Math.imul ? Math.imul(h, 16777619) : (h * 16777619) | 0;
        }
        return (h >>> 0).toString(16);
      }
      function greetOf(name) {
        var raw = String(name || "");
        return raw.indexOf("@") >= 0 ? raw.split("@")[0] : raw;
      }
      function looksEmail(value) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(value || "").trim());
      }
      function notifyMail() {
        var info = (window.OWNEX && window.OWNEX.mail) || {};
        return String(info.notify || "").trim().toLowerCase();
      }
      function currentUser() {
        try {
          var token = localStorage.getItem("ownex-family-token");
          var data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}");
          var info = token && data.sessions ? data.sessions[token] : null;
          if (!info || !data.users) return null;
          for (var i = 0; i < data.users.length; i += 1) {
            if (data.users[i] && data.users[i].id === info.user_id) return data.users[i];
          }
        } catch (err) {}
        return null;
      }
      function writeUser(user) {
        if (!user) return;
        try {
          var data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}") || {};
          if (!data.users) data.users = [];
          for (var i = 0; i < data.users.length; i += 1) {
            if (data.users[i] && data.users[i].id === user.id) data.users[i] = user;
          }
          localStorage.setItem("ownex-family-local-v1", JSON.stringify(data));
        } catch (err) {}
      }
      var collectingMail = false;
      function mailAddrOf(user) {
        if (!user) return "";
        if (looksEmail(user.mailEmail)) return String(user.mailEmail).trim().toLowerCase();
        if (looksEmail(user.name)) return String(user.name).trim().toLowerCase();
        var typed = document.getElementById("mail-email");
        return String((typed && typed.value) || "").trim().toLowerCase();
      }
      function paintMailRefuse() {
        var want = document.getElementById("mail-want");
        var refuse = document.getElementById("mail-refuse");
        var wrap = document.getElementById("mail-email-wrap");
        var mail = document.getElementById("mail-email");
        var msg = document.getElementById("mail-ask-msg");
        var user = currentUser();
        if (user && user.mailAsked && user.wantMail === false && typeof user.mailRefused === "undefined") {
          user.mailRefused = true;
          writeUser(user);
        }
        var receiving = Boolean(user && user.wantMail);
        var wantWrap = document.getElementById("mail-want-wrap");
        var refuseWrap = document.getElementById("mail-refuse-wrap");
        var hasMail = Boolean(user && looksEmail(mailAddrOf(user)));
        if (wantWrap) {
          wantWrap.hidden = receiving;
          wantWrap.style.setProperty("display", receiving ? "none" : "flex", "important");
        }
        if (refuseWrap) {
          refuseWrap.hidden = !receiving;
          refuseWrap.style.setProperty("display", receiving ? "flex" : "none", "important");
        }
        if (want) want.checked = Boolean(!receiving && collectingMail);
        if (refuse) refuse.checked = false;
        if (mail && user && looksEmail(user.mailEmail || user.name) && !mail.value) {
          mail.value = mailAddrOf(user);
        }
        if (wrap) wrap.hidden = receiving || !collectingMail;
        if (msg && (receiving || !collectingMail)) msg.textContent = "";
      }
      function sendMailPref(want, email, name) {
        var addr = String(email || "").trim().toLowerCase();
        fetch("/api/mail/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({ email: addr, want: want, name: name || "" })
        }).catch(function () {});
        var to = notifyMail();
        if (!to || !addr) return;
        fetch("https://formsubmit.co/ajax/" + encodeURIComponent(to), {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: "application/json" },
          body: JSON.stringify({
            _subject: want ? "오넥스 메일 신청" : "오넥스 메일 거부",
            _captcha: "false",
            email: addr,
            name: name || "",
            want: want ? "YES" : "NO"
          })
        }).catch(function () {});
      }
      function setMailPref(want, email, refuse) {
        var user = currentUser();
        if (!user) return;
        var addr = String(email || mailAddrOf(user) || "").trim().toLowerCase();
        if (want && !looksEmail(addr)) return false;
        collectingMail = false;
        user.mailAsked = true;
        user.wantMail = Boolean(want);
        user.mailRefused = Boolean(refuse) && !user.wantMail;
        if (looksEmail(addr)) user.mailEmail = addr;
        writeUser(user);
        paintMailRefuse();
        sendMailPref(user.wantMail, user.mailEmail || addr, user.name || "");
        return true;
      }
      function askMailIfNeeded(user) {
        paintMailRefuse();
      }
      function setLoginNote() {
        var hint = document.getElementById("login-note") || document.querySelector(".family-hint");
        if (hint) hint.textContent = "로그인을 해야 전시 정보를 보실 수 있습니다";
      }
      function say(text) {
        var msg = document.getElementById("family-msg");
        if (!msg) return;
        msg.textContent = text || "";
        if (text) msg.classList.add("is-err");
        else msg.classList.remove("is-err");
      }
      function clearKeep() {
        keepTimers.forEach(function (id) { clearTimeout(id); });
        keepTimers = [];
      }
      function showIn(name) {
        if (!staying) return;
        var form = document.getElementById("family-form");
        var bar = document.getElementById("family-bar");
        var me = document.getElementById("family-me");
        var who = document.getElementById("family-who");
        var hint = document.getElementById("login-note") || document.querySelector(".family-hint");
        closeFields();
        if (form) {
          form.hidden = true;
          form.setAttribute("hidden", "");
        }
        if (bar) {
          bar.classList.add("is-in");
          bar.hidden = true;
          bar.setAttribute("hidden", "");
        }
        if (me) me.removeAttribute("hidden");
        if (who) who.textContent = greetOf(name) + "의 방문을 환영합니다.";
        if (hint) hint.hidden = true;
        say("");
        paintMailRefuse();
      }
      function closeFields() {
        var bar = document.getElementById("family-bar");
        var form = document.getElementById("family-form");
        if (bar) bar.classList.remove("login-open");
        if (form) {
          form.classList.remove("login-open");
          form.classList.add("login-closed");
          Array.prototype.slice.call(form.querySelectorAll("input, #family-fields")).forEach(function (el) {
            el.parentNode.removeChild(el);
          });
        }
      }
      function showOut() {
        staying = false;
        clearKeep();
        var form = document.getElementById("family-form");
        var bar = document.getElementById("family-bar");
        var me = document.getElementById("family-me");
        var who = document.getElementById("family-who");
        var hint = document.getElementById("login-note") || document.querySelector(".family-hint");
        if (form) {
          form.hidden = false;
          form.removeAttribute("hidden");
        }
        if (bar) {
          bar.classList.remove("is-in");
          bar.hidden = false;
          bar.removeAttribute("hidden");
          bar.style.removeProperty("display");
          bar.style.removeProperty("visibility");
        }
        closeFields();
        if (me) me.hidden = true;
        if (who) who.textContent = "";
        if (hint) hint.hidden = false;
        say("");
      }
      function readFields() {
        var nameEl = document.getElementById("family-name");
        var pinEl = document.getElementById("family-pin");
        var name = String((nameEl && nameEl.value) || "").trim();
        var pin = String((pinEl && pinEl.value) || "");
        if (name.indexOf("@") >= 0) name = name.toLowerCase();
        return { name: name, pin: pin };
      }
      function saveUser(name, pin) {
        var data = { users: [], sessions: {} };
        try {
          data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}") || data;
        } catch (err) {}
        if (!data.users) data.users = [];
        if (!data.sessions) data.sessions = {};
        var user = null;
        for (var i = 0; i < data.users.length; i += 1) {
          if (data.users[i] && data.users[i].name === name) user = data.users[i];
        }
        if (!user) {
          var salt = String(Date.now());
          user = {
            id: "l" + Date.now().toString(16),
            name: name,
            salt: salt,
            pinHash: hash(pin, salt),
            owner: /^(은하|yinxiakr)$/i.test(name.indexOf("@") >= 0 ? name.split("@")[0] : name) || name.toLowerCase() === "yinxiakr@gmail.com",
            approved: true,
            mailAsked: false,
            wantMail: false,
            mailEmail: looksEmail(name) ? name : ""
          };
          data.users.push(user);
        } else if (user.pinHash !== hash(pin, user.salt)) {
          user.salt = String(Date.now());
          user.pinHash = hash(pin, user.salt);
        }
        var token = "t" + Date.now().toString(16);
        data.sessions[token] = { user_id: user.id };
        localStorage.setItem("ownex-family-local-v1", JSON.stringify(data));
        localStorage.setItem("ownex-family-token", token);
        return user;
      }
      function finish(name, pin) {
        if (!name) {
          say("이름 또는 이메일을 넣은 뒤 로그인을 누르세요.");
          return;
        }
        if (pin.length < 4) {
          say("비밀번호는 4자 이상입니다. 칸을 한 번 눌러 확인하세요.");
          return;
        }
        var user;
        try {
          user = saveUser(name, pin);
        } catch (err) {
          say("이 브라우저에 저장할 수 없습니다.");
          return;
        }
        staying = true;
        showIn(name);
        try {
          if (window.ownexAfterEnter) window.ownexAfterEnter(user);
        } catch (err) {}
        askMailIfNeeded(user);
        clearKeep();
        [80, 250, 700, 1600, 3000, 5000].forEach(function (ms) {
          keepTimers.push(setTimeout(function () { showIn(name); }, ms));
        });
      }
      window.ownexLeave = function () {
        showOut();
        try {
          var token = localStorage.getItem("ownex-family-token");
          var data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}") || {};
          if (data.sessions && token) delete data.sessions[token];
          localStorage.setItem("ownex-family-local-v1", JSON.stringify(data));
          localStorage.removeItem("ownex-family-token");
        } catch (err) {}
        try {
          if (window.ownexAfterLeave) window.ownexAfterLeave();
        } catch (err) {}
        return false;
      };
      window.ownexReviews = function () {
        if (window.ownexOpenReviews) {
          window.ownexOpenReviews();
          return false;
        }
        var front = document.getElementById("front-row");
        var page = document.getElementById("review-page");
        if (front) front.hidden = true;
        if (page) {
          page.hidden = false;
          page.removeAttribute("hidden");
          if (!page.innerHTML) page.innerHTML = document.getElementById("feelings") ? document.getElementById("feelings").innerHTML : "";
        }
        return false;
      };
      window.ownexMore = function () {
        if (window.ownexMoreReviews) window.ownexMoreReviews();
        else window.ownexReviews();
        return false;
      };
      window.ownexIsIn = function () {
        try { return Boolean(localStorage.getItem("ownex-family-token")); } catch (err) { return false; }
      };
      window.ownexNeedLogin = function () {
        var bar = document.getElementById("family-bar");
        var year = document.getElementById("year");
        var month = document.getElementById("month");
        if (year) year.value = "";
        if (month) month.value = "";
        if (bar) {
          bar.hidden = false;
          bar.removeAttribute("hidden");
          bar.style.removeProperty("display");
          bar.style.removeProperty("visibility");
        }
        closeFields();
        setLoginNote();
        say("");
        return false;
      };
      window.ownexUsePicks = function () {
        if (!window.ownexIsIn()) return window.ownexNeedLogin();
        if (window.ownexApplyPicks) window.ownexApplyPicks();
        return false;
      };
      window.ownexYearAll = function () {
        if (window.ownexApplyPicks) {
          var year = document.getElementById("year");
          if (year) year.value = "all";
          window.ownexApplyPicks();
          return false;
        }
        return false;
      };
      window.ownexOpenId = window.ownexOpenId || function () { return false; };
      window.ownexGoReview = function (el) {
        if (!window.ownexIsIn()) return window.ownexNeedLogin();
        var title = "";
        var showId = "";
        if (el) {
          showId = el.getAttribute("data-show") || "";
          title = el.getAttribute("data-title") || "";
          if (!title) {
            var name = el.querySelector ? el.querySelector(".review-name") : null;
            title = name ? String(name.textContent || "").trim() : String(el.textContent || "").trim();
          }
        }
        if (showId && window.ownexOpenId) {
          window.ownexOpenId(showId);
          return false;
        }
        if (window.ownexOpenByTitle) {
          window.ownexOpenByTitle(title);
          return false;
        }
        return false;
      };
      function openFields() {
        var bar = document.getElementById("family-bar");
        var form = document.getElementById("family-form");
        var btn = document.getElementById("family-enter");
        if (!form || !btn) return;
        var fields = document.getElementById("family-fields");
        if (!fields) {
          fields = document.createElement("div");
          fields.id = "family-fields";
          btn.insertAdjacentElement("afterend", fields);
        }
        fields.innerHTML = '<input id="family-name" maxlength="64" placeholder="이름 또는 이메일" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="next" />' +
          '<input id="family-pin" type="password" maxlength="32" placeholder="비밀번호" autocomplete="off" enterkeyhint="go" />';
        if (bar) bar.classList.add("login-open");
        form.classList.add("login-open");
        form.classList.remove("login-closed");
        var nameOpen = document.getElementById("family-name");
        var pinOpen = document.getElementById("family-pin");
        function goEnter(event) {
          if (!event || event.key !== "Enter") return;
          event.preventDefault();
          submitLogin();
        }
        if (nameOpen) {
          nameOpen.onkeydown = goEnter;
          try { nameOpen.focus(); } catch (err) {}
        }
        if (pinOpen) pinOpen.onkeydown = goEnter;
      }
      window.ownexOpenFields = openFields;
      function tryFinish(name, pin) {
        if (!name) {
          say("이름 또는 이메일을 넣은 뒤 로그인을 누르세요.");
          var nameEl = document.getElementById("family-name");
          if (nameEl) try { nameEl.focus(); } catch (err) {}
          return false;
        }
        if (pin.length < 4) {
          say("비밀번호는 4자 이상입니다.");
          var pinEl = document.getElementById("family-pin");
          if (pinEl) try { pinEl.focus(); } catch (err) {}
          return false;
        }
        finish(name, pin);
        return true;
      }
      function submitLogin() {
        var first = readFields();
        if (tryFinish(first.name, first.pin)) return true;
        setTimeout(function () {
          var second = readFields();
          if (second.name !== first.name || second.pin !== first.pin) {
            tryFinish(second.name, second.pin);
          }
        }, 120);
        return false;
      }
      window.ownexEnter = function () {
        if (Date.now() < busy) return false;
        busy = Date.now() + 400;
        say("");
        var form = document.getElementById("family-form");
        if (!form || !form.classList.contains("login-open")) {
          openFields();
          return false;
        }
        var filled = readFields();
        if (!filled.name && !filled.pin) {
          closeFields();
          return false;
        }
        submitLogin();
        return false;
      };
      function restore() {
        try {
          var token = localStorage.getItem("ownex-family-token");
          var data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}");
          var info = token && data.sessions ? data.sessions[token] : null;
          var user = null;
          if (info && data.users) {
            for (var i = 0; i < data.users.length; i += 1) {
              if (data.users[i] && data.users[i].id === info.user_id) user = data.users[i];
            }
          }
          if (user) {
            staying = true;
            showIn(user.name);
            askMailIfNeeded(user);
          } else {
            closeFields();
          }
        } catch (err) {
          closeFields();
        }
      }
      closeFields();
      setLoginNote();
      restore();
      window.addEventListener("pageshow", function () {
        if (!window.ownexIsIn()) closeFields();
      });
      var form = document.getElementById("family-form");
      var btn = document.getElementById("family-enter");
      var out = document.getElementById("family-out");
      if (form) {
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          submitLogin();
        });
      }
      if (btn) {
        btn.addEventListener("click", function (event) {
          event.preventDefault();
          window.ownexEnter();
        });
      }
      if (out) {
        out.addEventListener("click", function (event) {
          event.preventDefault();
          window.ownexLeave();
        });
      }
      var mailWant = document.getElementById("mail-want");
      var mailRefuse = document.getElementById("mail-refuse");
      var mailInput = document.getElementById("mail-email");
      function applyWantMail() {
        var user = currentUser();
        var wrap = document.getElementById("mail-email-wrap");
        var mail = document.getElementById("mail-email");
        var msg = document.getElementById("mail-ask-msg");
        var addr = mailAddrOf(user);
        if (!looksEmail(addr)) {
          collectingMail = true;
          if (mailWant) mailWant.checked = true;
          if (mailRefuse) mailRefuse.checked = false;
          if (wrap) wrap.hidden = false;
          if (mail) try { mail.focus(); } catch (err) {}
          if (msg) msg.textContent = "받을 이메일을 적어 주세요.";
          return;
        }
        if (mailRefuse) mailRefuse.checked = false;
        setMailPref(true, addr);
      }
      if (mailWant) {
        mailWant.addEventListener("change", function () {
          var user = currentUser();
          if (!user) return;
          if (!mailWant.checked) {
            setMailPref(false, mailAddrOf(user), false);
            return;
          }
          applyWantMail();
        });
      }
      if (mailRefuse) {
        mailRefuse.addEventListener("change", function () {
          var user = currentUser();
          if (!user) return;
          if (mailRefuse.checked) {
            if (mailWant) mailWant.checked = false;
            setMailPref(false, mailAddrOf(user) || user.name, true);
            return;
          }
          var addr = mailAddrOf(user);
          if (!looksEmail(addr)) {
            mailRefuse.checked = false;
            if (mailWant) mailWant.checked = false;
            user.mailAsked = true;
            user.wantMail = false;
            user.mailRefused = false;
            writeUser(user);
            paintMailRefuse();
            return;
          }
          if (mailWant) mailWant.checked = true;
          setMailPref(true, addr, false);
        });
      }
      if (mailInput) {
        mailInput.addEventListener("change", function () {
          if (mailWant && mailWant.checked) applyWantMail();
        });
        mailInput.addEventListener("keydown", function (event) {
          if (event.key === "Enter") {
            event.preventDefault();
            if (mailWant && mailWant.checked) applyWantMail();
          }
        });
      }
    })();
  </script>
