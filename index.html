<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="OWNEX" />
  <meta name="application-name" content="OWNEX" />
  <meta name="theme-color" content="#351e28" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>OWNEX</title>
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <script>
    (function () {
      fetch("build.json?t=" + Date.now(), { cache: "no-store" })
        .then(function (res) { return res.json(); })
        .then(function (info) {
          var now = String((info && info.build) || "");
          if (!now) return;
          try { localStorage.setItem("ownex-build", now); } catch (err) {}
        })
        .catch(function () {});
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Great+Vibes&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=fix3" />
  <style>
    body { margin: 0; min-height: 100vh; background: #351e28; color: #f6efe6; font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    #front-row:not([hidden]) {
      display: grid !important;
      grid-template-columns: minmax(18rem, 40rem) minmax(16rem, 1fr);
      gap: 1.5rem 2rem;
      align-items: start;
    }
    #front-row[hidden] { display: none !important; }
    #feelings.feel { max-width: 40rem; width: 100%; }
    #review-page.review-page { max-width: 40rem; }
    #praise-board {
      min-width: 14rem;
      max-width: 18rem;
      background: rgba(255,255,255,0.08);
      border: 1px solid #5a3a45;
      border-radius: 1.1rem;
      padding: 0.85rem 0.9rem 1rem;
    }
    @media (max-width: 800px) {
      #front-row:not([hidden]) {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: none !important;
        gap: 1.1rem !important;
        align-items: stretch !important;
      }
      #feelings.feel { max-width: 100%; }
      #praise-board {
        min-width: 0;
        max-width: 100%;
        width: 100%;
        padding-bottom: 1.15rem;
      }
    }
  </style>
</head>
<body data-season="fall">
  <div class="page-bg" aria-hidden="true">
    <div class="page-bg-sketch"></div>
    <div class="page-bg-wash"></div>
    <div class="page-bg-grain"></div>
  </div>
  <header class="hero">
    <p class="eyebrow">OWNEX <span class="open-count">접속 <strong id="glance-visitor-num">0</strong></span></p>
    <h1>오넥스</h1>
    <p class="lead">보고 듣고 가는 자리. 지금은 미술부터.</p>

    <div class="family-bar">
      <form id="family-form" action="#" method="post" onsubmit="ownexEnter(); return false;">
        <input id="family-name" name="name" maxlength="64" placeholder="이름 또는 이메일" autocomplete="username" enterkeyhint="next" />
        <input id="family-pin" name="pin" type="password" maxlength="32" placeholder="비밀번호" autocomplete="current-password" enterkeyhint="go" />
        <button type="submit" class="save" id="family-enter">들어가기</button>
      </form>
      <div id="family-me" hidden>
        <p id="family-who" class="family-hello"></p>
        <button type="button" id="family-out" class="save" onclick="ownexLeave()">나가기</button>
      </div>
      <p id="family-msg" class="quiet"></p>
      <p class="family-hint quiet">리뷰와 스티커는 바로 보입니다. 비밀번호는 4자 이상으로 넣고 들어가기를 누르세요.</p>
      <div id="family-people"></div>
    </div>

    <div class="fields" role="tablist" aria-label="분야">
      <button type="button" class="field on" data-field="exhibition">미술</button>
      <button type="button" class="field" data-field="music" disabled>음악</button>
      <button type="button" class="field" data-field="stage" disabled>공연</button>
    </div>

    <div class="picks-row">
      <div class="year-pick">
        <span>연도</span>
        <select id="year" onchange="ownexSyncPicks()">
          <option value="">연도를 고르세요</option>
          <option value="all">전체</option>
          <option value="2026">2026</option>
          <option value="2027">2027</option>
          <option value="2028">2028</option>
        </select>
      </div>
      <button type="button" id="year-all" class="year-all" onclick="ownexYearAll()">전체</button>
      <button type="button" id="glance-home" class="year-all" hidden>처음</button>
      <div class="year-pick" id="month-wrap">
        <span>월</span>
        <select id="month" onchange="ownexSyncPicks()">
          <option value="">월을 고르세요</option>
          <option value="01">1월</option>
          <option value="02">2월</option>
          <option value="03">3월</option>
          <option value="04">4월</option>
          <option value="05">5월</option>
          <option value="06">6월</option>
          <option value="07">7월</option>
          <option value="08">8월</option>
          <option value="09">9월</option>
          <option value="10">10월</option>
          <option value="11">11월</option>
          <option value="12">12월</option>
        </select>
      </div>
      <a id="gcal-icon" class="gcal-icon" href="https://calendar.google.com" target="_blank" rel="noopener" title="내 Ownex 구글 달력" aria-label="내 Ownex 구글 달력">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3.5" y="5" width="17" height="15" rx="3.5"/>
          <path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <div id="front-row" class="panel front-row">
      <section id="feelings" class="feel">
        <div class="feel-head"><h2>Review</h2></div>
        <div class="review-table">
          <div class="review-cols" aria-hidden="true">
            <span class="review-no">순번</span>
            <span class="review-date">날짜</span>
            <span class="review-name">제목</span>
            <span class="review-snip">소감</span>
          </div>
          <div class="review-item"><div class="review-last-row"><button type="button" class="review-line" data-title="큐비스트 감상" onclick="ownexGoReview(this)"><span class="review-no">1</span><span class="review-date">2026-09-03</span><span class="review-name">큐비스트 감상</span><span class="review-snip">유럽의 거장 큐비스트들을 통해 한국의 나헤석, 김환기 작가 등 한국 근현대 미술가들이 오버랩되어 한국의 큐비즘의 태동을 만난 것 같았다.</span></button></div></div>
          <div class="review-item"><div class="review-last-row"><button type="button" class="review-line" data-title="김희천: 두더지들" onclick="ownexGoReview(this)"><span class="review-no">2</span><span class="review-date">2026-09-03</span><span class="review-name">김희천: 두더지들</span><span class="review-snip">바쁜 현대 사회를 살아 가면서 잠깐 빠져 나오게 해 주는 작품이었습니다.</span></button></div></div>
        </div>
        <div class="review-foot">
          <button type="button" class="review-more-btn" data-reviews="more" onclick="ownexMore()">계속</button>
          <button type="button" class="review-all-btn" data-reviews="all" onclick="ownexReviews()">전체보기</button>
        </div>
      </section>
      <aside id="praise-board">
        <h2 class="praise-title">Achievement</h2>
        <p class="praise-total"><span class="praise-num">7</span><span class="praise-total-label">다녀온 전시</span></p>
        <p class="praise-score">7 / 25</p>
        <div class="praise-art sheet">
          <div class="praise-sheet">
            <span class="praise-sticker on" style="background:#e39a86" title="구정아: 우스모스"></span><span class="praise-sticker on" style="background:#d4a05c" title="가우디: 서울에서 다시 태어나다"></span><span class="praise-sticker on" style="background:#c9849a" title="게오르그 바젤리츠"></span><span class="praise-sticker on" style="background:#6faf8e" title="뱅크시 : Still Here"></span><span class="praise-sticker on" style="background:#d9b15a" title="박서보: 변하는 변하지 않는"></span>
            <span class="praise-sticker on" style="background:#c87868" title="큐비스트: 시각의 혁신가들"></span><span class="praise-sticker on" style="background:#7ea4b8" title="김희천: 두더지들"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span>
            <span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span>
            <span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span>
            <span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span><span class="praise-sticker empty"></span>
          </div>
        </div>
      </aside>
    </div>
    <section id="review-page" class="panel review-page" hidden></section>
    <section id="own-cal" class="panel own-cal" hidden></section>
    <section id="month-list" class="panel" hidden></section>
    <section id="artwork" class="panel" hidden></section>
  </main>

  <footer></footer>

  <script>
    (function () {
      var el = document.getElementById("glance-visitor-num");
      function paintCount(n) {
        var num = Number(n);
        if (!isFinite(num) || num < 1) return;
        if (el) el.textContent = String(num);
        try { localStorage.setItem("ownex-guest-total", String(num)); } catch (err) {}
      }
      var counted = false;
      try { counted = sessionStorage.getItem("ownex-open-hit") === "1"; } catch (err) {}
      var n = 0;
      try { n = Number(localStorage.getItem("ownex-guest-total") || 0) || 0; } catch (err) {}
      if (!counted) {
        n += 1;
        try { sessionStorage.setItem("ownex-open-hit", "1"); } catch (err) {}
      }
      paintCount(n);
      window.ownexAbacus = function (payload) {
        var v = Number((payload && (payload.value || payload.total || payload.count)) || 0);
        if (v > n) paintCount(v);
      };
      var kind = counted ? "get" : "hit";
      var src = "https://abacus.jsn.cam/" + kind + "/ownex-yinxiakr/opens?callback=ownexAbacus&t=" + Date.now();
      var tag = document.createElement("script");
      tag.src = src;
      tag.onerror = function () {
        var tag2 = document.createElement("script");
        tag2.src = "https://abacus.jasoncameron.dev/" + kind + "/ownex-yinxiakr/opens?callback=ownexAbacus&t=" + Date.now();
        document.head.appendChild(tag2);
      };
      document.head.appendChild(tag);

      var busy = 0;
      var staying = false;
      var keepTimers = [];
      function hash(pin, salt) {
        var h = 2166136261;
        var s = String(salt) + String(pin);
        for (var i = 0; i < s.length; i += 1) {
          h ^= s.charCodeAt(i);
          h = Math.imul ? Math.imul(h, 16777619) : (h * 16777619) | 0;
        }
        return (h >>> 0).toString(16);
      }
      function greetOf(name) {
        var raw = String(name || "");
        return raw.indexOf("@") >= 0 ? raw.split("@")[0] : raw;
      }
      function say(text) {
        var msg = document.getElementById("family-msg");
        if (!msg) return;
        msg.textContent = text || "";
        if (text) msg.classList.add("is-err");
        else msg.classList.remove("is-err");
      }
      function clearKeep() {
        keepTimers.forEach(function (id) { clearTimeout(id); });
        keepTimers = [];
      }
      function showIn(name) {
        if (!staying) return;
        var form = document.getElementById("family-form");
        var me = document.getElementById("family-me");
        var who = document.getElementById("family-who");
        var hint = document.querySelector(".family-hint");
        if (form) form.hidden = true;
        if (me) me.removeAttribute("hidden");
        if (who) who.textContent = greetOf(name) + "의 방문을 환영합니다.";
        if (hint) hint.hidden = true;
        say("");
      }
      function showOut() {
        staying = false;
        clearKeep();
        var form = document.getElementById("family-form");
        var me = document.getElementById("family-me");
        var who = document.getElementById("family-who");
        var hint = document.querySelector(".family-hint");
        if (form) {
          form.hidden = false;
          form.removeAttribute("hidden");
        }
        if (me) me.hidden = true;
        if (who) who.textContent = "";
        if (hint) hint.hidden = false;
        say("");
      }
      function readFields() {
        var nameEl = document.getElementById("family-name");
        var pinEl = document.getElementById("family-pin");
        var name = String((nameEl && nameEl.value) || "").trim();
        var pin = String((pinEl && pinEl.value) || "");
        if (name.indexOf("@") >= 0) name = name.toLowerCase();
        return { name: name, pin: pin };
      }
      function saveUser(name, pin) {
        var data = { users: [], sessions: {} };
        try {
          data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}") || data;
        } catch (err) {}
        if (!data.users) data.users = [];
        if (!data.sessions) data.sessions = {};
        var user = null;
        for (var i = 0; i < data.users.length; i += 1) {
          if (data.users[i] && data.users[i].name === name) user = data.users[i];
        }
        if (!user) {
          var salt = String(Date.now());
          user = {
            id: "l" + Date.now().toString(16),
            name: name,
            salt: salt,
            pinHash: hash(pin, salt),
            owner: data.users.length === 0,
            approved: true
          };
          data.users.push(user);
        } else if (user.pinHash !== hash(pin, user.salt)) {
          user.salt = String(Date.now());
          user.pinHash = hash(pin, user.salt);
        }
        var token = "t" + Date.now().toString(16);
        data.sessions[token] = { user_id: user.id };
        localStorage.setItem("ownex-family-local-v1", JSON.stringify(data));
        localStorage.setItem("ownex-family-token", token);
        return user;
      }
      function finish(name, pin) {
        if (!name) {
          say("이름 또는 이메일을 한 번 눌러 확인한 뒤 들어가기를 누르세요.");
          return;
        }
        if (pin.length < 4) {
          say("비밀번호는 4자 이상입니다. 칸을 한 번 눌러 확인하세요.");
          return;
        }
        var user;
        try {
          user = saveUser(name, pin);
        } catch (err) {
          say("이 브라우저에 저장할 수 없습니다.");
          return;
        }
        staying = true;
        showIn(name);
        try {
          if (window.ownexAfterEnter) window.ownexAfterEnter(user);
        } catch (err) {}
        clearKeep();
        [80, 250, 700, 1600, 3000, 5000].forEach(function (ms) {
          keepTimers.push(setTimeout(function () { showIn(name); }, ms));
        });
      }
      window.ownexLeave = function () {
        showOut();
        try {
          var token = localStorage.getItem("ownex-family-token");
          var data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}") || {};
          if (data.sessions && token) delete data.sessions[token];
          localStorage.setItem("ownex-family-local-v1", JSON.stringify(data));
          localStorage.removeItem("ownex-family-token");
        } catch (err) {}
        try {
          if (window.ownexAfterLeave) window.ownexAfterLeave();
        } catch (err) {}
        return false;
      };
      window.ownexReviews = function () {
        if (window.ownexOpenReviews) {
          window.ownexOpenReviews();
          return false;
        }
        var front = document.getElementById("front-row");
        var page = document.getElementById("review-page");
        if (front) front.hidden = true;
        if (page) {
          page.hidden = false;
          page.removeAttribute("hidden");
          if (!page.innerHTML) page.innerHTML = document.getElementById("feelings") ? document.getElementById("feelings").innerHTML : "";
        }
        return false;
      };
      window.ownexMore = function () {
        if (window.ownexMoreReviews) window.ownexMoreReviews();
        else window.ownexReviews();
        return false;
      };
      window.ownexSyncPicks = window.ownexSyncPicks || function () { return false; };
      window.ownexYearAll = function () {
        var year = document.getElementById("year");
        if (year) year.value = "all";
        if (window.ownexSyncPicks) window.ownexSyncPicks();
        return false;
      };
      window.ownexGoReview = function (el) {
        var title = "";
        if (el) {
          title = el.getAttribute("data-title") || "";
          if (!title) {
            var name = el.querySelector ? el.querySelector(".review-name") : null;
            title = name ? String(name.textContent || "").trim() : String(el.textContent || "").trim();
          }
        }
        if (window.ownexOpenByTitle) {
          window.ownexOpenByTitle(title);
          return false;
        }
        return false;
      };
      window.ownexEnter = function () {
        if (Date.now() < busy) return false;
        busy = Date.now() + 350;
        say("");
        var first = readFields();
        if (!first.name || first.pin.length < 4) {
          setTimeout(function () {
            var second = readFields();
            finish(second.name || first.name, second.pin || first.pin);
          }, 80);
          return false;
        }
        finish(first.name, first.pin);
        return false;
      };
      function restore() {
        try {
          var token = localStorage.getItem("ownex-family-token");
          var data = JSON.parse(localStorage.getItem("ownex-family-local-v1") || "{}");
          var info = token && data.sessions ? data.sessions[token] : null;
          var user = null;
          if (info && data.users) {
            for (var i = 0; i < data.users.length; i += 1) {
              if (data.users[i] && data.users[i].id === info.user_id) user = data.users[i];
            }
          }
          if (user) {
            staying = true;
            showIn(user.name);
          }
        } catch (err) {}
      }
      restore();
      var form = document.getElementById("family-form");
      var btn = document.getElementById("family-enter");
      var out = document.getElementById("family-out");
      if (form) {
        form.addEventListener("submit", function (event) {
          event.preventDefault();
          window.ownexEnter();
        });
      }
      if (btn) {
        btn.addEventListener("click", function (event) {
          event.preventDefault();
          window.ownexEnter();
        });
      }
      if (out) {
        out.addEventListener("click", function (event) {
          event.preventDefault();
          window.ownexLeave();
        });
      }
    })();
  </script>
  <script src="data.js?v=fix3"></script>
  <script src="app.js?v=fix3"></script>
</body>
</html>
