name: Ownex morning

on:
  schedule:
    # GitHub은 몇 시간 늦게 켜질 수 있어, 한국 시간 02:30에 대기열에 넣고
    # 프로그램이 오전 8:00까지 기다렸다가 메일을 보냅니다.
    - cron: "30 2 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

defaults:
  run:
    working-directory: daily

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Korean fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore secrets
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          mkdir -p data
          umask 077
          {
            echo "GMAIL_ADDRESS=${GMAIL_ADDRESS}"
            echo "GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}"
          } > .env
          printf '%s' "$GOOGLE_TOKEN_JSON" > data/google_token.json
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > data/google_credentials.json
      - name: Send mail and calendar
        env:
          TZ: Asia/Seoul
          OWNEX_SKIP_BROWSER: "1"
          OWNEX_SKIP_WEB: "1"
          OWNEX_CLOUD: "1"
          CI: "true"
        run: python run.py
